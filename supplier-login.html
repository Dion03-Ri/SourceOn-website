  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">E-Mail</label>
      <input type="email" class="form-input" id="login-email" placeholder="lieferant@beispiel.ch" required/>
    </div>

      <input type="password" class="form-input" id="login-password" placeholder="Dein Passwort" required/>
    </div>
    <button type="submit" class="btn-gold" id="login-btn">Anmelden</button>
  </form>

  <div class="msg msg-error" id="msg-error"></div>
  <div class="msg msg-warn" id="msg-pending"></div>
  <div class="msg msg-info" id="msg-rejected"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://kiyoklfuqjzrlrbtxecq.supabase.co';
const SUPABASE_KEY='sb_publishable_tLgWMkxbLWUvmluogsBl1w_-8zYPa_8';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMsg(id,text){
  document.querySelectorAll('.msg').forEach(function(m){m.classList.remove('show');});
  var el=document.getElementById(id);
  el.textContent=text;
  el.classList.add('show');
}

async function handleLogin(e){
  e.preventDefault();
  var btn=document.getElementById('login-btn');
  btn.disabled=true;
  btn.textContent='Wird geprüft…';
  document.querySelectorAll('.msg').forEach(function(m){m.classList.remove('show');});

  var email=document.getElementById('login-email').value.trim();
  var password=document.getElementById('login-password').value;

  var authResult=await supabase.auth.signInWithPassword({email:email,password:password});
  if(authResult.error){
    showMsg('msg-error','Login fehlgeschlagen: '+authResult.error.message);
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  var uid=authResult.data.user.id;
  var profileResult=await supabase.from('suppliers').select('status,company_name').eq('id',uid).single();

  if(profileResult.error){
    showMsg('msg-error','Profil konnte nicht geladen werden. Bitte kontaktiere info@sourceon.ch');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  var status=profileResult.data.status;

  if(status==='pending'){
    showMsg('msg-pending','Dein Profil wird noch geprüft. Wir melden uns innerhalb von 48 Stunden.');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  if(status==='rejected'){
    showMsg('msg-rejected','Deine Bewerbung wurde leider nicht angenommen. Kontaktiere uns für Details: info@sourceon.ch');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  if(status==='verified'){
    window.open('supplierdashboard.html','_blank');
    btn.disabled=false;
    btn.textContent='Anmelden';
  }
}
</script>

<script>
(function(){
  var COOKIE_I18N={
    de:{t:'Wir verwenden technisch notwendige Cookies f\u00fcr Login und Sicherheit. Keine Tracking- oder Werbe-Cookies.',b:'Verstanden'},
    en:{t:'We use technically necessary cookies for login and security. No tracking or advertising cookies.',b:'Got it'},
    fr:{t:'Nous utilisons des cookies techniquement n\u00e9cessaires pour la connexion et la s\u00e9curit\u00e9. Pas de cookies de suivi ou publicitaires.',b:'Compris'},
    it:{t:"Utilizziamo cookie tecnicamente necessari per l'accesso e la sicurezza. Nessun cookie di tracciamento o pubblicitario.",b:'Capito'}
  };
  function lang(){var l=localStorage.getItem('sourceon-lang')||'de';return COOKIE_I18N[l]?l:'de';}
  function paint(){var d=COOKIE_I18N[lang()];var tx=document.querySelector('#cookie-banner .cookie-text');var bt=document.querySelector('#cookie-banner .cookie-btn');if(tx)tx.textContent=d.t;if(bt)bt.textContent=d.b;}
  window.acceptCookies=function(){try{localStorage.setItem('sourceon_cookie_accepted','1');}catch(e){}var b=document.getElementById('cookie-banner');if(b)b.style.display='none';};
  function initCookieBanner(){paint();try{if(!localStorage.getItem('sourceon_cookie_accepted')){var b=document.getElementById('cookie-banner');if(b)b.style.display='flex';}}catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initCookieBanner);else initCookieBanner();
  var _o=window.setLang;if(typeof _o==='function'){window.setLang=function(l){_o(l);paint();};}
})();
