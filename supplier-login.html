<script>/*TEMPORARY PREVIEW GATE — remove from all pages once SourceOn is ready for public launch. This is a simple client-side gate, NOT real security.*/
(function(){
  var PREVIEW_PASSWORD='2026-View-SourceOn@Previewsite003!!';
  if(localStorage.getItem('sourceon_preview_access')==='granted')return;
  document.documentElement.style.visibility='hidden';
  window.addEventListener('DOMContentLoaded',function(){
    document.body.innerHTML='';
    document.body.style.cssText='margin:0;padding:0;min-height:100vh;background:#0F2238;display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,sans-serif';
    document.documentElement.style.visibility='visible';
    var box=document.createElement('div');
    box.style.cssText='text-align:center;max-width:420px;width:100%;padding:24px';
    box.innerHTML='<div style="font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:32px">Source<span style="color:#E8A020">On</span></div>'
      +'<p style="color:#94A3B8;font-size:.92rem;line-height:1.7;margin-bottom:32px">SourceOn befindet sich im Aufbau.<br>Diese Seite ist noch nicht öffentlich verfügbar.</p>'
      +'<input id="pg-pw" type="password" placeholder="Passwort" style="width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-size:.9rem;font-family:inherit;outline:none;margin-bottom:12px"/>'
      +'<button id="pg-btn" style="width:100%;padding:12px;border-radius:10px;border:none;background:#E8A020;color:#08111E;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer">Zugang</button>'
      +'<div id="pg-err" style="color:#EF4444;font-size:.82rem;margin-top:12px;display:none">Falsches Passwort.</div>';
    document.body.appendChild(box);
    var inp=document.getElementById('pg-pw');
    var btn=document.getElementById('pg-btn');
    var err=document.getElementById('pg-err');
    function tryAccess(){if(inp.value===PREVIEW_PASSWORD){localStorage.setItem('sourceon_preview_access','granted');window.location.reload();}else{err.style.display='block';inp.value='';}}
    btn.addEventListener('click',tryAccess);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryAccess();});
    inp.focus();
  });
})();
</script>
<!--
  SECURITY NOTE: Supplier verification status must be manually reviewed
  and updated in the Supabase Table Editor by changing the 'status' field
  from 'pending' to 'verified' or 'rejected' until an admin review panel
  is built in a future phase.

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lieferanten-Login — SourceOn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#0F2238;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
a{color:#E8A020;text-decoration:none}
a:hover{text-decoration:underline}

.login-logo{margin-bottom:40px;text-align:center}
.login-logo span{font-size:28px;font-weight:800;letter-spacing:-.5px}
.login-logo span em{font-style:normal;color:#E8A020}

.login-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:40px;width:100%;max-width:420px;margin:0 16px}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:6px}
.login-card p.sub{font-size:14px;color:#94A3B8;margin-bottom:28px}

.form-label{display:block;font-size:13px;font-weight:600;color:#94A3B8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-family:inherit;transition:border-color .2s}
.form-input:focus{outline:none;border-color:#E8A020}
.form-input::placeholder{color:#64748B}
.form-group{margin-bottom:18px}

.btn-gold{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#E8A020,#f0b840);color:#0F172A;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center;margin-top:24px}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(232,160,32,.35)}
.btn-gold:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

.login-footer{margin-top:24px;text-align:center;font-size:13px;color:#94A3B8}

.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;line-height:1.6;display:none}
.msg-info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);color:#93C5FD}
.msg-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#FCA5A5}
.msg-warn{background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.25);color:#E8A020}
.msg.show{display:block}

.back-link{margin-top:32px;text-align:center}
.back-link a{font-size:13px;color:#94A3B8}
.back-link a:hover{color:#E8A020}
</style>
  <link rel="stylesheet" href="mobile-nav.css">
</head>
<body>

<div class="login-logo">
  <span>Source<em>On</em></span>
</div>

<div class="login-card">
  <h1>Lieferanten-Login</h1>
  <p class="sub">Melde dich an um offene Ausschreibungen einzusehen.</p>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">E-Mail</label>
      <input type="email" class="form-input" id="login-email" placeholder="lieferant@beispiel.ch" required/>
    </div>
    <div class="form-group">
      <label class="form-label">Passwort</label>
      <input type="password" class="form-input" id="login-password" placeholder="Dein Passwort" required/>
    </div>
    <button type="submit" class="btn-gold" id="login-btn">Anmelden</button>
  </form>

  <div class="msg msg-error" id="msg-error"></div>
  <div class="msg msg-warn" id="msg-pending"></div>
  <div class="msg msg-info" id="msg-rejected"></div>

  <p class="login-footer">Noch nicht registriert? <a href="index.html#supplier">Jetzt als Lieferant bewerben</a></p>
</div>

<div class="back-link"><a href="index.html">← Zurück zur Hauptseite</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://kiyoklfuqjzrlrbtxecq.supabase.co';
const SUPABASE_KEY='sb_publishable_tLgWMkxbLWUvmluogsBl1w_-8zYPa_8';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showMsg(id,text){
  document.querySelectorAll('.msg').forEach(function(m){m.classList.remove('show');});
  var el=document.getElementById(id);
  el.textContent=text;
  el.classList.add('show');
}

async function handleLogin(e){
  e.preventDefault();
  var btn=document.getElementById('login-btn');
  btn.disabled=true;
  btn.textContent='Wird geprüft…';
  document.querySelectorAll('.msg').forEach(function(m){m.classList.remove('show');});

  var email=document.getElementById('login-email').value.trim();
  var password=document.getElementById('login-password').value;

  var authResult=await supabase.auth.signInWithPassword({email:email,password:password});
  if(authResult.error){
    showMsg('msg-error','Login fehlgeschlagen: '+authResult.error.message);
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  var uid=authResult.data.user.id;
  var profileResult=await supabase.from('suppliers').select('status,company_name').eq('id',uid).single();

  if(profileResult.error){
    showMsg('msg-error','Profil konnte nicht geladen werden. Bitte kontaktiere info@sourceon.ch');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  var status=profileResult.data.status;

  if(status==='pending'){
    showMsg('msg-pending','Dein Profil wird noch geprüft. Wir melden uns innerhalb von 48 Stunden.');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  if(status==='rejected'){
    showMsg('msg-rejected','Deine Bewerbung wurde leider nicht angenommen. Kontaktiere uns für Details: info@sourceon.ch');
    btn.disabled=false;
    btn.textContent='Anmelden';
    return;
  }

  if(status==='verified'){
    window.open('supplierdashboard.html','_blank');
    btn.disabled=false;
    btn.textContent='Anmelden';
  }
}
</script>
  <script src="mobile-nav.js"></script>
</body>
</html>
